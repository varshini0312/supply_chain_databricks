resources:
  jobs:
    supply_chain_medallion_pipeline:
      name: supply-chain-medallion-pipeline-${bundle.target}
      description: Bronze -> Silver -> Gold -> Data quality gate
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # daily 02:00
        timezone_id: UTC
        pause_status: PAUSED
      email_notifications:
        on_failure: ["data-eng-team@example.com"]
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_config.py
            base_parameters: { catalog: ${var.catalog} }
        - task_key: bronze_ingestion
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.py
            base_parameters: { catalog: ${var.catalog} }
        - task_key: silver_transformations
          depends_on: [{ task_key: bronze_ingestion }]
          notebook_task:
            notebook_path: ../notebooks/02_silver_transformations.py
            base_parameters: { catalog: ${var.catalog} }
        - task_key: gold_marts
          depends_on: [{ task_key: silver_transformations }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_marts.py
            base_parameters: { catalog: ${var.catalog} }
        - task_key: data_quality_checks
          depends_on: [{ task_key: gold_marts }]
          notebook_task:
            notebook_path: ../notebooks/04_data_quality_checks.py
            base_parameters: { catalog: ${var.catalog} }
