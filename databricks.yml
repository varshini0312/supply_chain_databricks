# Databricks Asset Bundle - deploy with:  databricks bundle deploy -t dev
bundle:
  name: supply_chain_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: supply_chain

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
  prod:
    mode: production
    variables:
      catalog: supply_chain_prod
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
